[project]
name = "misongyny-dataset-paper"
version = "0.1.0"
description = "Dataset and LLM-evaluation code for a paper on misogyny detection in Spanish song lyrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "transformers[torch]>=5.16.1",
    "wordcloud>=1.9.6",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
]
